plugins {
	id 'groovy'
	id 'java-library'
	id 'maven-publish'
	id 'codenarc'
	id 'jacoco'
	id 'pl.allegro.tech.build.axion-release' version '1.21.1'
}

def targetJava = 17
def groovyVersion = '6.0.0'
def spockVersion = '2.5-groovy-6.0'

group = 'com.github.grational'
version = scmVersion.version

java {
	toolchain.languageVersion = JavaLanguageVersion.of(targetJava)
}

repositories {
	mavenCentral()
}

dependencies {
	def groovyGroup = groovyVersion.startsWith('3.') ? 'org.codehaus.groovy' : 'org.apache.groovy'
	api "${groovyGroup}:groovy:${groovyVersion}"
	api 'com.zaxxer:HikariCP:3.4.5'
	implementation 'org.slf4j:slf4j-api:1.7.36'
	testRuntimeOnly 'mysql:mysql-connector-java:8.0.29'

	testImplementation "org.spockframework:spock-core:$spockVersion"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	environment 'PREFIX_DB_JDBC_URL', 'jdbc:mysql://localhost/test'
	environment 'PREFIX_DB_USERNAME', 'fixture'
	environment 'PREFIX_DB_PASSWORD', 'fixture'
	environment 'PREFIX_DB_DRIVER', 'com.mysql.cj.jdbc.Driver'
}

codenarc {
	toolVersion = '4.0.0'
	ignoreFailures = true
}

codenarcMain { configFile = file('config/codenarc/ruleset.groovy') }
codenarcTest { configFile = file('config/codenarc/ruleset-test.groovy') }

tasks.register('unitTest', Test) {
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	exclude '**/*ISpec*', '**/*FSpec*'
}

publishing {
	publications {
		mavenJava(MavenPublication) { from components.java }
	}
}
